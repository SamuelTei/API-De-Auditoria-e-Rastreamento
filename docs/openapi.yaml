openapi: 3.0.3
info:
  title: API de Auditoria e Rastreamento
  version: 1.0.0
  description: >
    API REST que mantém um histórico completo e imutável de ações de
    usuários (quem, o quê, quando e o diff dos dados), com captura
    automática de auditoria para os recursos de negócio.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Products
  - name: Audit Logs

paths:
  /health:
    get:
      summary: Verifica se a API está no ar
      responses:
        '200':
          description: OK

  /auth/register:
    post:
      tags: [Auth]
      summary: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201': { description: Usuário criado, token JWT retornado }
        '409': { description: E-mail já cadastrado }

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuário e retorna um token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Login efetuado, token JWT retornado }
        '401': { description: Credenciais inválidas }

  /products:
    get:
      tags: [Products]
      summary: Lista produtos (paginado)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: Lista paginada de produtos }
    post:
      tags: [Products]
      summary: Cria um produto (auditado automaticamente)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string }
                description: { type: string }
                price: { type: number }
                quantity: { type: integer }
      responses:
        '201': { description: Produto criado }
        '401': { description: Não autenticado }

  /products/{id}:
    get:
      tags: [Products]
      summary: Obtém um produto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Produto encontrado }
        '404': { description: Produto não encontrado }
    patch:
      tags: [Products]
      summary: Atualiza um produto (auditado automaticamente, com diff)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Produto atualizado }
    delete:
      tags: [Products]
      summary: Remove um produto (auditado automaticamente, apenas ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Produto removido }
        '403': { description: Apenas administradores podem remover }

  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: Lista registros de auditoria com filtros (apenas ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - name: action
          in: query
          schema:
            type: string
            enum: [CREATE, UPDATE, DELETE, LOGIN, LOGIN_FAILED, LOGOUT]
        - { name: dateFrom, in: query, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Lista paginada de registros de auditoria }
        '403': { description: Apenas administradores }

  /audit-logs/export:
    get:
      tags: [Audit Logs]
      summary: Exporta registros de auditoria filtrados em CSV (apenas ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Arquivo CSV
          content:
            text/csv:
              schema: { type: string }

  /audit-logs/entity/{entityType}/{entityId}:
    get:
      tags: [Audit Logs]
      summary: Linha do tempo completa de um recurso específico (apenas ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: entityType, in: path, required: true, schema: { type: string } }
        - { name: entityId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Eventos de auditoria do recurso, em ordem cronológica }

  /audit-logs/{id}:
    get:
      tags: [Audit Logs]
      summary: Obtém um registro de auditoria específico (apenas ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Registro de auditoria }
        '404': { description: Não encontrado }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
